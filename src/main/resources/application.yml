spring:
  application:
    name: weather-service
  threads:
    virtual:
      enabled: true
  mvc:
    problemdetails:
      enabled: true

weather:
  # How long a provider result, or a failed refresh attempt, is served from memory before the
  # providers are asked again.
  cache-ttl: 3s
  providers:
    # Failover order is fixed in WeatherConfiguration: weatherstack first, openweathermap second.
    # The timeout is one window per request covering connecting, the headers and the body, so a
    # provider that hangs anywhere costs about this long before the next one is tried.
    weatherstack:
      base-url: https://api.weatherstack.com
      api-key: ${WEATHERSTACK_ACCESS_KEY:}
      timeout: 2s
    openweathermap:
      base-url: https://api.openweathermap.org
      api-key: ${OPENWEATHERMAP_API_KEY:}
      timeout: 2s
  circuit-breaker:
    # A provider is skipped (circuit open) once at least half of its last 6 calls failed, judged
    # after no fewer than 3 calls, and retried with one trial call after 30s.
    sliding-window-size: 6
    minimum-number-of-calls: 3
    failure-rate-threshold: 50
    wait-duration-in-open-state: 30s
    permitted-calls-in-half-open-state: 1

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
